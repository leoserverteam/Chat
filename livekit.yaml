port: 7880

# Use development key for testing
keys:
  devkey: secret

# Room auto-creation
room:
  auto_create: true
  max_participants: 100
  max_metadata_size: 2000

# Logging
logging:
  level: info
  sample: false

# Development settings
development: false

# API binding
bind_addresses:
  - "0.0.0.0"

# Webhook URL (optional - for event notifications)
# webhook_urls:
#   - "https://your-webhook-endpoint.com/livekit"

# Recording (optional)
# recording:
#   enabled: false
#   output_dir: /data/recordings

# Ingress (optional)
# ingress:
#   rtmp:
#     enabled: false

# RTC Configuration
rtc:
  port_range_start: 50000
  port_range_end: 60000
  use_external_ip: false
  
# Turn servers (optional)
# turn:
#   enabled: true
#   servers:
#     - urls:
#         - "turn:your-turn-server.com"
#       username: "user"
#       credential: "pass"
