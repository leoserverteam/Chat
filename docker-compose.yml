services:
  synapse:
    image: matrixdotorg/synapse:latest
    container_name: synapse
    restart: unless-stopped
    volumes:
      - /mnt/Share/Element/synapse-data:/data
    environment:
      - SYNAPSE_CONFIG_PATH=/data/homeserver.yaml
    ports:
      - "8008:8008"
    extra_hosts:
      - "leonet.site:host-gateway"
    depends_on:
      - coturn
      - livekit

  element:
    image: vectorim/element-web:latest
    container_name: element
    restart: unless-stopped
    volumes:
      - /mnt/Share/Element/element-config.json:/app/config.json
    ports:
      - "8081:80"

  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_DB=synapse
      - POSTGRES_USER=synapse
      - POSTGRES_PASSWORD=${PG_PASS}
    volumes:
      - /mnt/Share/Element/postgres-data:/var/lib/postgresql/data
  
  coturn:
    image: coturn/coturn:latest
    container_name: coturn
    restart: unless-stopped
    network_mode: "host"
    volumes:
      - /mnt/Share/Element/coturn/turnserver.conf:/etc/turnserver.conf:ro

  livekit:
    image: livekit/livekit-server:v1.5
    container_name: livekit
    restart: unless-stopped
    network_mode: "host"
    volumes:
      - /mnt/Share/Element/livekit/livekit.yaml:/etc/livekit.yaml:ro
    command: --config /etc/livekit.yaml