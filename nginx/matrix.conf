server {
    listen 80;
    listen [::]:80;
    server_name matrix.leonet.site;

    # Редирект на HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name matrix.leonet.site;

    include snippets/sslpath.conf; 

    # Добавляем заголовок Origin из вашего маппинга
    add_header 'Access-Control-Allow-Origin' "$cors_header" always;

    # Стандартные заголовки для CORS
    add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE' always;
    add_header 'Access-Control-Allow-Headers' 'Origin, X-Requested-With, Content-Type, Accept, Authorization' always;
    add_header 'Access-Control-Allow-Credentials' 'true' always;

    #Обработка предварительных (preflight) запросов OPTIONS
    if ($request_method = 'OPTIONS') {
        add_header 'Access-Control-Allow-Origin' "$cors_header" always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE' always;
        add_header 'Access-Control-Allow-Headers' 'Origin, X-Requested-With, Content-Type, Accept, Authorization' always;
        add_header 'Access-Control-Max-Age' 1728000;
        add_header 'Content-Type' 'text/plain; charset=utf-8';
        add_header 'Content-Length' 0;
        return 204;
    }


    location / {
        proxy_pass http://localhost:8008;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Важно для больших загрузок (файлы в комнатах)
        client_max_body_size 50M;
    }

    # Для корректной работы Federation (опционально, но рекомендуется)
    location /.well-known/matrix/server {
        default_type application/json;
        return 200 '{"m.server": "matrix.leonet.site:443"}';
        add_header Access-Control-Allow-Origin *;
    }

    location /.well-known/matrix/client {
        default_type application/json;
        return 200 '{"m.homeserver": {"base_url": "https://leonet.site"}}';
        add_header Access-Control-Allow-Origin *;
    }
}
