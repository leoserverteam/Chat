name: Deploy Matrix Server

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  validate:
    name: Validate Configuration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate Docker Compose
        run: |
          docker-compose config > /dev/null
          echo "✓ docker-compose.yml is valid"

      - name: Check required files
        run: |
          required_files=(
            ".env.example"
            "docker-compose.yml"
            "element-config.json"
            "livekit.yaml"
            "synapsedeploy.sh"
          )
          
          for file in "${required_files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "✗ Missing required file: $file"
              exit 1
            fi
          done
          echo "✓ All required files present"

  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build summary
        run: |
          echo "## ✓ Build Successful" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Services ready to deploy:**" >> $GITHUB_STEP_SUMMARY
          echo "- Synapse (matrixdotorg/synapse:latest)" >> $GITHUB_STEP_SUMMARY
          echo "- PostgreSQL (postgres:15-alpine)" >> $GITHUB_STEP_SUMMARY
          echo "- Element Web (vectorim/element-web:latest)" >> $GITHUB_STEP_SUMMARY
          echo "- LiveKit (livekit/livekit-server:latest)" >> $GITHUB_STEP_SUMMARY

  deploy:
    name: Deploy Services
    runs-on: [self-hosted, linux]
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin

      - name: Create shared data directories
        run: |
          sudo mkdir -p /mnt/Share/chat/synapse
          sudo mkdir -p /mnt/Share/chat/postgres
          sudo mkdir -p /mnt/Share/chat/livekit
          sudo chown -R $(id -u):$(id -g) /mnt/Share/chat
          echo "✓ Data directories created at /mnt/Share/chat"

      - name: Pull latest images
        run: |
          echo "🐳 Pulling latest Docker images..."
          docker-compose pull
          echo "✓ Images pulled successfully"

      - name: Deploy services
        run: |
          echo "🚀 Deploying services..."
          docker-compose up -d --force-recreate
          echo "✓ Services deployed"

      - name: Wait for services to be healthy
        run: |
          echo "⏳ Waiting for services to start..."
          sleep 10
          
          max_attempts=30
          attempt=0
          
          echo "🔍 Checking Synapse health..."
          while [ $attempt -lt $max_attempts ]; do
            if docker-compose exec -T synapse curl -f http://localhost:8008/_synapse/admin/v1/server_version > /dev/null 2>&1; then
              echo "✓ Synapse is healthy"
              break
            fi
            attempt=$((attempt+1))
            if [ $attempt -eq $max_attempts ]; then
              echo "✗ Synapse health check failed after $max_attempts attempts"
              docker-compose logs synapse | tail -30
              exit 1
            fi
            sleep 2
          done

      - name: Verify all services
        run: |
          echo "🔍 Verifying all services..."
          
          echo "Checking Synapse..."
          docker-compose ps synapse | grep -q "Up" && echo "✓ Synapse running" || (echo "✗ Synapse not running"; exit 1)
          
          echo "Checking PostgreSQL..."
          docker-compose ps db | grep -q "Up" && echo "✓ PostgreSQL running" || (echo "✗ PostgreSQL not running"; exit 1)
          
          echo "Checking Element..."
          docker-compose ps element | grep -q "Up" && echo "✓ Element running" || (echo "✗ Element not running"; exit 1)
          
          echo "Checking LiveKit..."
          docker-compose ps livekit | grep -q "Up" && echo "✓ LiveKit running" || (echo "✗ LiveKit not running"; exit 1)

      - name: Log services status
        run: |
          echo "## 📊 Services Status" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✓ Synapse (Matrix Server): Running" >> $GITHUB_STEP_SUMMARY
          echo "✓ PostgreSQL: Running" >> $GITHUB_STEP_SUMMARY
          echo "✓ Element Web: Running" >> $GITHUB_STEP_SUMMARY
          echo "✓ LiveKit: Running" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📁 Data stored at: `/mnt/Share/chat/`" >> $GITHUB_STEP_SUMMARY

      - name: Deploy Failed Notification
        if: failure()
        run: |
          echo "## ✗ Deployment Failed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Please check the logs above for details." >> $GITHUB_STEP_SUMMARY
          docker-compose logs
          exit 1

  call-nginx:
    name: Configure nginx
    needs: deploy
    uses: leoserverteam/DevOpsTemplates/.github/workflows/deploynginx.yml@main
    secrets: inherit

  rollback:
    name: Rollback on Failure
    runs-on: [self-hosted, linux]
    needs: deploy
    if: failure()
    steps:
      - name: Checkout previous version
        uses: actions/checkout@v4
        with:
          ref: HEAD~1

      - name: Rollback deployment
        run: |
          echo "⏮️  Rolling back to previous version..."
          docker-compose down
          docker-compose up -d
          sleep 5
          docker-compose ps
          echo "✓ Rollback completed"

      - name: Rollback notification
        run: |
          echo "## ⏮️ Rollback Executed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Deployment failed and was rolled back to the previous version." >> $GITHUB_STEP_SUMMARY
